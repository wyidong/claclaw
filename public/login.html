<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- 主屏幕 Web App：状态栏用 default（black-translucent 时 iOS 会在状态栏下加一层模糊）。
     这几项 iOS 只在「添加到主屏幕」时读一次，改了要删掉图标重新添加 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claclaw">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=11">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=11">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F2F0F8">
<title>登录 · Claclaw</title>
<script>(function(){try{if(localStorage.getItem('claclaw.lang')==='en')document.write('<script src="/i18n/en.js"><\/script>')}catch(e){}})();</script>
<style>
@font-face{font-family:"Nunito";font-style:normal;font-weight:400 800;font-display:swap;src:url(/fonts/nunito-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}   /* 圆润的英文 / 数字：苹果设备用系统自带的圆体（ui-rounded），别的浏览器用这个（开源，授权见 public/fonts/OFL-Nunito.txt）；中文仍是系统字体 */
/* 和 clarelay 主页同一个样子：浅紫底、白卡片、紫色字和按钮；只有这一套，不跟主题 */
html,body{height:100%;margin:0}
body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0 20px 6vh;box-sizing:border-box;color:#7C3AED;
  background:radial-gradient(120% 55% at 100% 30%,rgba(167,139,250,.30),transparent 70%),radial-gradient(110% 60% at 0% 100%,rgba(124,58,237,.22),transparent 70%),linear-gradient(#F2F0F8,#EAE4FA);
  font:15px/1.45 ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
form{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:340px;box-sizing:border-box;padding:26px 20px 22px;background:rgba(255,255,255,.88);border:1px solid #E1DDEC;border-radius:16px}
.ic{width:52px;height:52px;border-radius:14px;background:#EDE9FE;color:#7C3AED;display:flex;align-items:center;justify-content:center}
.ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0 0 8px;font-size:22px;font-weight:600;color:#7C3AED}
[hidden]{display:none!important}
input{width:100%;height:46px;box-sizing:border-box;padding:0 12px;font:inherit;font-size:16px;color:#1F1B2E;background:#fff;border:1px solid #E1DDEC;border-radius:10px;outline:none}
input::placeholder{color:#B3B6BF}
input:focus{border-color:#7C3AED;box-shadow:0 0 0 3px #EDE9FE}
#err{color:#D93636;min-height:1.4em;font-size:13px;margin:-2px 0 -4px;text-align:center}
button{width:100%;height:46px;padding:0;font:inherit;font-size:16px;font-weight:600;color:#fff;background:#7C3AED;border:1px solid #7C3AED;border-radius:10px;cursor:pointer}
button:active{background:#6D28D9}
button:disabled{opacity:.6}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>claclaw</h1>
  <input id="u" name="username" placeholder="用户名" aria-label="用户名" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
  <input id="pw" name="password" type="password" placeholder="密码" aria-label="密码" autocomplete="current-password">
  <div id="err" role="alert"></div>
  <button type="submit" id="go">登录</button>
</form>
<script>
(function(){
var f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
var u=document.getElementById('u'),pw=document.getElementById('pw');
// 只有登录。还没设账号时这里怎么输都登录不上：账号在本机或第一台设备的「登录账号」页里设（原来的 /setup 设置页不用了）
f.addEventListener('submit',function(e){
  e.preventDefault();err.textContent='';
  go.disabled=true;
  fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({username:u.value,password:pw.value})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}})})
  .then(function(x){
    if(x.ok)location.replace('/');
    else{err.textContent=x.j.error||'失败';go.disabled=false}
  })
  .catch(function(){err.textContent='连不上服务';go.disabled=false});
});
u.focus();
})();
</script>
</body>
</html>
