function goList(){
  if(DESKTOP.matches)return;
  if(session){wsSend({t:'session.leave'});saveFeed(session.id);session=null;setBusy(false)}   // 先存（聊天区还可见，量得出高度）再切到列表
  if(!mList){mList=true;$('#app').classList.add('m-list')}
  try{sessionStorage.setItem('claclaw.view','list')}catch(_){}
  // 回到列表：直接显示在聊天页时后台排好的列表，不取数据、不重建，点哪个都立刻进去
  if(!$('#sList .s-row'))openSheet();else{syncPushBtn();tickTimes()}
  renderUnread();renderActivity();
}
// 手机：进入会话、内容加载完的那一刻在后台刷新一次列表并重新排序（列表被聊天页挡着看不到）；
// 服务器此时已把这次打开记为活跃，返回列表时当前会话就在「最近活跃」第一位。列表页里顺序完全不动
function bgRefreshList(){if(!DESKTOP.matches&&!mList){listResort=true;openSheet(true)}}
// 列表页里只在原位更新「几分钟前」
function tickTimes(){
  document.querySelectorAll('#sList .s-item[data-lm]').forEach(function(it){
    var t=ago(+it.dataset.lm);it.dataset.when=t;
    var r=it.parentNode;if(!r.classList.contains('working')&&!r.classList.contains('opening')){var w=it.querySelector('.when');if(w)w.textContent=t}
  });
}
function goChat(){
  if(DESKTOP.matches)return;
  if(mList){mList=false;$('#app').classList.remove('m-list');history.pushState({chat:1},'')}
  try{sessionStorage.setItem('claclaw.view','chat')}catch(_){}
}
$('#backBtn').addEventListener('click',function(){if(history.state&&history.state.chat)history.back();else goList()});
window.addEventListener('popstate',function(){
  if(DESKTOP.matches)return;
  if($('#app').classList.contains('set-on'))railTab(false);   // 从设置子页面返回会话列表
  else if(!mList)goList();                                     // 从聊天页返回会话列表
});
setInterval(function(){if(mList&&!document.hidden)tickTimes()},60000);   // 列表页每分钟只更新时间文字，不重排
function openFailed(){
  var was=opening||pendingOpen;pendingOpen=null;   // 打不开（被别处占着、不存在……）：不要每次重连都再试
  if(was&&!session&&!DESKTOP.matches)goList();
}
function clearOpening(){opening=null;document.querySelectorAll('#sList .s-row.opening').forEach(function(r){r.classList.remove('opening')});renderActivity()}
// 点通知进入对应会话：手机上立刻切到聊天页；App 在后台待久了连接常常已经断了，
// 所以先记下要打开的会话，连接正常就马上发，断了就重连、连上后第一件事打开它
var pendingOpen=null;
// 读后台脚本记下的「点通知要打开的会话」（1 分钟内有效，读完就删）
function takePendingOpen(){
  if(!window.caches)return Promise.resolve(null);
  return caches.open('claclaw-nav').then(function(c){
    return c.match('/__pending-open').then(function(r){
      if(!r)return null;
      return r.json().then(function(j){c.delete('/__pending-open');return j&&j.id&&Date.now()-j.at<60000?j.id:null});
    });
  }).catch(function(){return null});
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  takePendingOpen().then(function(id){if(id)openFromNotice(id)});   // 从后台回来：消息可能丢了，以这条记录为准
});
function openFromNotice(id){
  if(session&&session.id===id&&!mList)return;
  pendingOpen=id;
  if(!DESKTOP.matches){if(!restoreFeed(id))feed.innerHTML='<div class="sys">加载中…</div>';$('#nm').textContent='';$('#sid').textContent=id.slice(0,8);goChat()}
  if(ws&&ws.readyState===1)wsSend({t:'session.open',id:id,mode:mode});else reconnectNow();
  setTimeout(function(){if(pendingOpen===id)reconnectNow()},3000);   // 3 秒没打开：连接多半是死的，重连（连上后会自动打开）
}
// ---------- 进过的会话：画好的聊天内容留在内存里，再进来直接放回去（最多 8 个）----------
var feedCache={},feedSig=null,feedDirty=false;
function histSig(h,total){var l=h[h.length-1]||{};return (total||h.length)+'|'+(l.kind||'')+'|'+(l.status||'')+'|'+String(l.text||l.output||l.target||l.name||'').slice(-120)}
// 画一段历史；每条历史对应聊天区里一个元素，打上 data-h 好数「缓存里留了几条」
function renderHistory(items){
  items.forEach(function(it){
    if(it.kind==='user')addUser(it.text,it.images);
    else if(it.kind==='ai')addAi(it.text);
    else if(it.kind==='peer')addPeer(it.from,it.text);
    else if(it.kind==='tool'){var c=newCard(it);finishCard(c,it.output,it.status==='no')}
    else return;
    if(feed.lastElementChild)feed.lastElementChild.dataset.h='1';
  });
}
// 往上滑到顶：向服务器要更早的一页，接到最上面，画面位置不跳
// 一次上滑（包括它的惯性）最多加载一页：加载后要等滚动停下来（0.25 秒没动）才允许下一页；只在往上滑时触发
var histStart=0,histMore=false,histLoading=false,histArmed=true,lastTop=0,scrollIdle=null;
feed.addEventListener('scroll',function(){
  var top=feed.scrollTop,up=top<lastTop;lastTop=top;
  clearTimeout(scrollIdle);scrollIdle=setTimeout(function(){
    histArmed=true;
    if(feed.scrollTop<=120)loadOlder();   // 停在顶部：加载一页（插入后位置会离开顶部，不会连环加载）
  },250);
  if(!histArmed||!up||top>120)return;
  loadOlder();
});
function loadOlder(){
  if(!session||!histMore||histLoading)return;
  histLoading=true;histArmed=false;wsSend({t:'history.more',before:histStart});
  setTimeout(function(){histLoading=false},4000);
}
function prependHistory(m){
  histLoading=false;
  if(!session||m.id!==session.id)return;
  histStart=m.start;histMore=!!m.more;
  if(!m.items.length)return;
  var real=feed,tmp=document.createElement('div'),keepStick=stick;
  feed=tmp;stick=false;try{renderHistory(m.items)}finally{feed=real;stick=keepStick}
  var h0=feed.scrollHeight,top0=feed.scrollTop,f=document.createDocumentFragment();
  while(tmp.firstChild)f.appendChild(tmp.firstChild);
  // iPhone 惯性滚动时直接改 scrollTop 会被忽略，惯性会一路冲到顶、接着连续加载：先短暂停掉滚动，再放回原位
  feed.style.overflowY='hidden';
  feed.insertBefore(f,feed.firstChild);
  feed.scrollTop=top0+(feed.scrollHeight-h0);   // 保持正在看的位置不动
  lastTop=feed.scrollTop;
  requestAnimationFrame(function(){feed.style.overflowY='';feed.scrollTop=lastTop;fillShort()});
}
// 内容还不够一屏（滑不动就收不到 scroll）：自动再要一页，直到能滑为止
function fillShort(){
  if(session&&histMore&&!histLoading&&feed.scrollHeight<=feed.clientHeight+80){histLoading=true;wsSend({t:'history.more',before:histStart});setTimeout(function(){histLoading=false},4000)}
}
// 离开会话：只留最后大约一屏半（手机内存省着用），再进来立刻显示；更早的往上滑时再从服务器取
function saveFeed(id){
  if(!id||!feed.firstChild)return;
  if(thinkEl){thinkEl.remove();thinkEl=null}
  var need=Math.max(600,feed.clientHeight*1.5),acc=0,kept=0,n=feed.lastElementChild;
  while(n&&acc<need){acc+=n.offsetHeight||0;if(n.dataset.h)kept++;n=n.previousElementSibling}
  while(n){var p=n.previousElementSibling;n.remove();n=p}   // 一屏以外的都扔掉
  var f=document.createDocumentFragment();while(feed.firstChild)f.appendChild(feed.firstChild);
  delete feedCache[id];feedCache[id]={frag:f,cards:cards,kept:kept,sig:feedDirty?null:feedSig};   // 看的时候有新内容进来：回来时一定按服务器的重画
  var ks=Object.keys(feedCache);while(ks.length>8)delete feedCache[ks.shift()];
}
function restoreFeed(id){
  var c=feedCache[id];if(!c)return false;
  if(c.inDom){delete feedCache[id];return false}   // 上次放回去后没打开成功：作废，按服务器的重画
  feed.innerHTML='';feed.appendChild(c.frag);c.inDom=true;stick=true;feed.scrollTop=feed.scrollHeight;return true;
}
// ---------- 主题 ----------
function applyTheme(t){
  var root=document.documentElement;
  if(t==='light'||t==='dark')root.setAttribute('data-theme',t);else root.removeAttribute('data-theme');
  var cs=document.querySelector('meta[name="color-scheme"]');if(cs)cs.content=t==='light'?'light':t==='dark'?'dark':'light dark';
  // 状态栏 / 浏览器顶栏颜色：选了固定主题就两条 theme-color 都用那个颜色
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){
    var dark=/dark/.test(m.media);m.content=t==='light'?'#FFFFFF':t==='dark'?'#161B21':(dark?'#161B21':'#FFFFFF');
  });
}
(function(){
  var sel=$('#setTheme'),t='';try{t=localStorage.getItem('claclaw.theme')||''}catch(_){}
  sel.value=t;applyTheme(t);
  sel.addEventListener('change',function(){
    try{if(sel.value)localStorage.setItem('claclaw.theme',sel.value);else localStorage.removeItem('claclaw.theme')}catch(_){}
    applyTheme(sel.value);
  });
})();
function notice(t){if(mList)toast(t);else addSys(t)}

// ---------- 推送通知：https + 添加到主屏幕后才能开（iOS 16.4+） ----------

var pushBtn=$('#pushBtn'),pushTip=$('#pushTip');
function pushUI(on){pushBtn.dataset.on=on?'1':'';$('#pushSub').textContent=on?'回复完了、要你确认时会提醒这台设备':'关着：这台设备收不到提醒'}
var swReg=null;
if('serviceWorker' in navigator&&window.isSecureContext){
  navigator.serviceWorker.register('/sw.js').then(function(r){swReg=r}).catch(function(e){console.warn('sw',e)});
  // 点通知 → Service Worker 发来要打开的地址（/?s=会话ID）
  navigator.serviceWorker.addEventListener('message',function(e){
    var d=e.data||{};if(d.t!=='open')return;
    var s=new URL(d.url,location.href).searchParams.get('s');
    if(s)openFromNotice(s);
  });
}
function b64ToU8(b){var p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,function(c){return c.charCodeAt(0)})}
function pushSupported(){return window.isSecureContext&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function syncPushBtn(){
  pushBtn.hidden=false;pushTip.hidden=true;
  if(!pushSupported()){
    pushBtn.hidden=true;pushTip.hidden=false;
    pushTip.textContent=window.isSecureContext?'这个浏览器不支持推送通知；iPhone 要先「添加到主屏幕」，从主屏幕图标打开':'推送通知要用 https 地址打开才能开启';
    // http 打开时给出 https 地址，点一下就过去（那边要重新登录、重新添加到主屏幕）
    if(!window.isSecureContext)fetch('/api/push/key').then(function(r){return r.json()}).then(function(j){
      if(!j.httpsUrl)return;
      pushTip.textContent='推送通知要用 https 地址打开才能开启：';
      var a=document.createElement('a');a.href=j.httpsUrl;a.textContent=j.httpsUrl.replace(/^https:\/\//,'');a.style.color='var(--accent)';
      pushTip.appendChild(a);
      pushTip.appendChild(document.createTextNode('（打开后重新登录，再添加到主屏幕）'));
    }).catch(function(){});
    return;
  }
  if(Notification.permission==='denied'){pushBtn.hidden=true;pushTip.hidden=false;pushTip.textContent='通知被拒绝了：到 iPhone 设置 → 通知 → Claclaw 里打开';return}
  pushUI(false);$('#pushLocal').hidden=true;
  navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription()}).then(function(sub){
    if(!sub)return;
    return fetch('/api/push/status?endpoint='+encodeURIComponent(sub.endpoint)).then(function(r){return r.json()}).then(function(j){
      if(j.subscribed){pushUI(true);$('#pushLocal').hidden=false}
    });
  }).catch(function(){});
}
// 电脑提示音：推送时由运行 claclaw 的那台 Mac 直接响一声（浏览器的网页通知常常没声音）
var soundBtn=$('#soundBtn');
var SOUND_CN={Basso:'低沉',Blow:'吹气',Bottle:'瓶子',Frog:'蛙鸣',Funk:'放克',Glass:'玻璃',Hero:'英雄',Morse:'摩斯',Ping:'乒',Pop:'啵',Purr:'呼噜',Sosumi:'Sosumi',Submarine:'潜水艇',Tink:'叮'};
function showSound(j){
  soundBtn.hidden=!j.supported;
  var sel=$('#soundSel');
  $('#soundPick').hidden=!(j.supported&&j.on);
  if(j.sounds&&sel.options.length!==j.sounds.length){
    sel.innerHTML='';
    j.sounds.forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=(SOUND_CN[n]||n)+(SOUND_CN[n]&&SOUND_CN[n]!==n?'（'+n+'）':'');sel.appendChild(o)});
  }
  if(j.name)sel.value=j.name;
  soundBtn.dataset.on=j.on?'1':'';
}
function syncSound(){fetch('/api/sound').then(function(r){return r.json()}).then(showSound).catch(function(){})}
soundBtn.addEventListener('click',function(){
  fetch('/api/sound',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({on:!soundBtn.dataset.on})})
    .then(function(r){return r.json()}).then(function(j){showSound(j);toast(j.on?'已开启，刚才应该响了一声':'已关闭电脑提示音')});

// 排查用：直接在本机弹一条通知，不经苹果/微软的推送服务。
// 这条能弹、推送的不弹 → 问题在推送送达；这条也不弹 → 问题在系统或浏览器的通知设置
$('#pushLocal').addEventListener('click',function(){
  navigator.serviceWorker.ready.then(function(r){
    return r.showNotification('Claclaw 本机测试',{body:'能看到这条，说明系统通知设置没问题 '+new Date().toTimeString().slice(0,8),tag:'local-test',icon:'/icons/icon-192.png'});
  }).then(function(){toast('已弹出本机测试通知')},function(e){alert('弹通知失败：'+e.message)});
});
pushBtn.addEventListener('click',function(){
  if(pushBtn.dataset.on){
    navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription()}).then(function(sub){
      if(!sub)return;
      return fetch('/api/push/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}).then(function(){return sub.unsubscribe()});
    }).then(syncPushBtn);
    return;
  }
  // 每一步都显示在按钮上、并且有超时：卡住时能看出卡在哪一步，不会一直「正在开启…」
  function step(label,p,sec){
    $('#pushSub').textContent=label;
    return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error(label.replace(/…$/,'')+'超时（'+sec+' 秒没反应）'))},sec*1000)})]);
  }
  // iOS 要求：请求通知权限必须直接由这次点击触发
  step('等你允许通知…（看看有没有弹出询问框）',Notification.requestPermission(),60).then(function(perm){
    if(perm!=='granted'){syncPushBtn();if(perm==='denied')alert('通知被拒绝了：到浏览器或系统设置里允许这个网站发通知');return}
    return step('正在准备…',Promise.all([navigator.serviceWorker.ready,fetch('/api/push/key').then(function(r){return r.json()})]),15).then(function(x){
      return step('正在向推送服务登记…',x[0].pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(x[1].publicKey)}),20);
    }).then(function(sub){
      return fetch('/api/push/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON()})});
    }).then(function(r){
      if(!r.ok)throw new Error('保存订阅失败');
      return fetch('/api/push/test',{method:'POST'});
    }).then(function(){addSys('通知已开启，发了一条测试通知');syncPushBtn()});
  }).catch(function(e){alert('开启通知失败：'+e.message);syncPushBtn()});
});

// ---------- 会话改名 ----------

function renameSess(s){
  var t=prompt('给会话改个名字',s.title);
  if(t===null)return;
  t=t.replace(/\s+/g,' ').trim();
  if(!t||t===s.title)return;
  fetch('/api/sessions/rename',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:s.id,title:t})})
    .then(function(r){if(r.status===401){location.replace('/login');throw new Error('需要登录')}return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(x){if(!x.ok){alert(x.j.error||'改名失败');return}openSheet()})
    .catch(function(e){alert('改名失败：'+e.message)});
}

var delDlg=$('#delDlg'),delTarget=null;
function openDel(s){
  delTarget=s;
  $('#delTitle').textContent='删除「'+s.title+'」？';
  $('#delU').value='';$('#delP').value='';$('#delErr').textContent='';$('#delGo').disabled=false;
  delDlg.classList.add('on');delDlg.setAttribute('aria-hidden','false');
  $('#delU').focus();
}
function closeDel(){delDlg.classList.remove('on');delDlg.setAttribute('aria-hidden','true');delTarget=null}
$('#delNo').addEventListener('click',closeDel);
delDlg.addEventListener('click',function(e){if(e.target===delDlg)closeDel()});
$('#delForm').addEventListener('submit',function(e){
  e.preventDefault();if(!delTarget)return;
  var t=delTarget;$('#delErr').textContent='';$('#delGo').disabled=true;
  fetch('/api/sessions/delete',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({id:t.id,username:$('#delU').value,password:$('#delP').value})})
  .then(function(r){if(r.status===401&&!r.headers.get('content-type'))location.replace('/login');return r.json().then(function(j){return {ok:r.ok,j:j}})})
  .then(function(x){
    if(!x.ok){$('#delErr').textContent=x.j.error||'删除失败';$('#delGo').disabled=false;return}
    closeDel();
    if(session&&session.id===t.id)localStorage.removeItem('claclaw.session');
    else addSys('已删除会话「'+t.title+'」');
    openSheet();
  })
  .catch(function(){$('#delErr').textContent='连不上服务';$('#delGo').disabled=false});
});

    document.body.classList.toggle('kb',window.innerHeight-vh>120);
    app.style.height=Math.max(200,vh)+'px';
    window.scrollTo(0,0);scrollDown();
  };
  fit();
  window.visualViewport.addEventListener('resize',fit);
  window.visualViewport.addEventListener('scroll',function(){window.scrollTo(0,0)});
}

$('#sessBtn .dot').classList.add('off');
syncSend();
// 启动时先看是不是点通知启动的，再连服务器（这样第一屏就直接是那个会话，不先落在列表）
takePendingOpen().then(function(id){if(id)pendingOpen=id;connect()});
})();
</script>
