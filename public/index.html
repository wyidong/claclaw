// ---------- 斜杠命令菜单：输入框以 / 开头、还没打空格时弹出 ----------

var cmdMenu=$('#cmdMenu');
function syncCmdMenu(){
  var v=ta.value,m=v.match(/^\/(\S*)$/);
  if(!m||!session||busy||dock.dataset.state==='perm'||dock.dataset.state==='ask'){cmdMenu.hidden=true;return}
  var q=m[1].toLowerCase();
  // 匹配度：名字相同 0 > 名字以它开头 1 > 名字里某个词以它开头 2 > 名字包含 3 > 只有说明包含 4
  var scored=[];
  commands.forEach(function(c,idx){
    var n=c.name.toLowerCase(),sc;
    if(!q)sc=1;
    else if(n===q)sc=0;
    else if(n.indexOf(q)===0)sc=1;
    else if(n.split(/[-_:]/).some(function(w){return w.indexOf(q)===0}))sc=2;
    else if(n.indexOf(q)>0)sc=3;
    else if(c.description.toLowerCase().indexOf(q)>=0)sc=4;
    else return;
    scored.push({c:c,sc:sc,idx:idx});
  });
  scored.sort(function(a,b){return a.sc-b.sc||(q?a.c.name.length-b.c.name.length:0)||a.idx-b.idx});
  cmdShown=scored.map(function(x){return x.c}); // [0] 最匹配
  if(cmdSel>=cmdShown.length)cmdSel=0;
  cmdMenu.innerHTML='';
  if(!cmdShown.length){
    cmdMenu.innerHTML='<div class="cmd-empty">'+(commands.length?'没有匹配的命令':'命令列表加载中…')+'</div>';
  }
  // 倒着排：最匹配的在最下面，紧挨输入框
  for(var i=cmdShown.length-1;i>=0;i--)(function(c,i){
    var b=document.createElement('button');b.type='button';b.className='cmd';b.setAttribute('role','option');
    b.setAttribute('aria-selected',i===cmdSel?'true':'false');
    b.innerHTML='<span class="cn"></span><span class="ch"></span><span class="cd"></span>';
    b.querySelector('.cn').textContent='/'+c.name;
    b.querySelector('.ch').textContent=c.hint||'';
    b.querySelector('.cd').textContent=c.description||'';
    b.addEventListener('mousedown',function(e){e.preventDefault()}); // 不让输入框失焦收起键盘
    b.addEventListener('click',function(){pickCmd(i)});
    b.dataset.i=i;
    cmdMenu.appendChild(b);
  })(cmdShown[i],i);
  cmdMenu.hidden=false;
  var cur=cmdMenu.querySelector('[data-i="'+cmdSel+'"]');
  if(cmdSel===0)cmdMenu.scrollTop=cmdMenu.scrollHeight;else if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest'});
}
function pickCmd(i){
  var c=cmdShown[i];if(!c)return;
  ta.value='/'+c.name+' ';
  cmdMenu.hidden=true;
  ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  syncSend();syncSuggestion();
}
function setDock(s){dock.dataset.state=s;syncSend()}
// 「发送」永远是发送；工作中另外放出一个「停止」，两个按钮不会因为打字变来变去
function syncSend(){
  var d=DESKTOP.matches,at=attachments||[];
  sendBtn.innerHTML=d?'发送':ICON_SEND;sendBtn.setAttribute('aria-label','发送');
  sendBtn.disabled=!(ta.value.trim()||at.length)||!session||at.some(function(a){return !a.data});
  // 输入框空着、有建议（灰字）时：发送键保持灰色样子，但能点，点了把建议填进输入框（不直接发）
  var sugOn=sendBtn.disabled&&!!suggestion&&!ta.value&&!at.length&&!!session;
  sendBtn.classList.toggle('sugfill',sugOn);if(sugOn){sendBtn.disabled=false;sendBtn.setAttribute('aria-label','填入建议')}
  var sb=$('#stopBtn');sb.hidden=!busy;sb.innerHTML=d?'停止':ICON_STOP;
  $('#composer').classList.toggle('busy',busy);
}
function setBusy(b){
  if(b&&!busy){workSince=Date.now();workLabel='思考中';clearInterval(workTimer);workTimer=setInterval(tickWork,1000)}
  if(!b){clearInterval(workTimer);workTimer=null;workSince=0}
  busy=b;if(b&&!lastEvt)lastEvt=Date.now();
  $('#sessBtn .dot').classList.toggle('busy',b);tickWork();
  if(b)cmdMenu.hidden=true;
  if(b)suggestion=null;
  syncSuggestion();
  if(!b)think(false);
  if(permQueue.length){if(dock.dataset.state!=='perm'&&dock.dataset.state!=='ask')showPerm()}else setDock(b?'busy':'idle');
}

// ---------- 权限确认 ----------

function showPerm(){
  var p=permQueue[0];
  if(!p){setDock(busy?'busy':'idle');return}
  if(p.questions){showAsk(p);return}
  var verb=p.name==='Bash'?'运行这条命令':/^(Edit|Write|MultiEdit|NotebookEdit)$/.test(p.name)?'修改这个文件':p.name==='ExitPlanMode'?'按这个计划开始动手':'使用 '+p.displayName;
  $('#permTitle').textContent=p.title||('允许'+verb+'？');
  var sub=p.target||p.description||'';
  var c=cards[p.toolUseID];
  if(c&&c.stat)sub+='　'+c.stat;
  if(p.reason)sub+='\n'+p.reason;
  $('#permSub').textContent=sub;
  $('#bAllow').textContent=p.name==='Bash'?'允许运行':/^(Edit|Write|MultiEdit|NotebookEdit)$/.test(p.name)?'允许修改':'允许';
  var al=$('#bAlways');
  if(p.canAlways){al.hidden=false;al.textContent=p.alwaysLabel||'本会话内同类操作都不再询问'}else{al.hidden=true}
  setDock('perm');
  (p.defaultToNo?$('#bDeny'):$('#bAllow')).focus({preventScroll:true});
}
// ---------- 选择题（AskUserQuestion）：单选 / 多选 / 其他（自己填） ----------

var askSel=[];   // 每题：{picks:Set(选项序号), other:'' , otherOn:false}
function showAsk(p){
  var body=$('#askBody');body.innerHTML='';
  askSel=p.questions.map(function(){return {picks:new Set(),other:'',otherOn:false}});
  p.questions.forEach(function(q,qi){
    var box=document.createElement('div');box.className='q';
    if(q.header){var h=document.createElement('span');h.className='qh';h.textContent=q.header;box.appendChild(h)}
    var t=document.createElement('div');t.className='qt';t.textContent=q.question;
    var tip=document.createElement('span');tip.className='qm';tip.textContent=q.multiSelect?'（可多选）':'';t.appendChild(tip);
    box.appendChild(t);
    var btns=[];
    var refresh=function(){
      btns.forEach(function(b,i){b.setAttribute('aria-checked',i<q.options.length?String(askSel[qi].picks.has(i)):String(askSel[qi].otherOn))});
      other.hidden=!askSel[qi].otherOn;
      syncAsk();
    };
    q.options.concat([{label:'其他',description:'自己填写答案'}]).forEach(function(o,oi){
      var b=document.createElement('button');b.type='button';b.className='opt';b.setAttribute('role',q.multiSelect?'checkbox':'radio');
      b.innerHTML='<span class="ol"></span><span class="od"></span>';
      b.querySelector('.ol').textContent=o.label;b.querySelector('.od').textContent=o.description||'';
      b.addEventListener('click',function(){
        var st=askSel[qi],isOther=oi===q.options.length;
        if(q.multiSelect){
          if(isOther)st.otherOn=!st.otherOn;else if(st.picks.has(oi))st.picks.delete(oi);else st.picks.add(oi);
        }else{
          st.picks.clear();st.otherOn=isOther;if(!isOther)st.picks.add(oi);
        }
        refresh();
        if(isOther&&st.otherOn)other.focus();
      });
      btns.push(b);box.appendChild(b);
    });
    var other=document.createElement('input');other.className='opt-other';other.placeholder='写下你的答案';other.hidden=true;
    other.addEventListener('input',function(){askSel[qi].other=other.value;syncAsk()});
    // 键盘弹起、面板变矮后，把输入框滚到看得见的位置
    other.addEventListener('focus',function(){setTimeout(function(){other.scrollIntoView({block:'nearest'})},350)});
    box.appendChild(other);
    body.appendChild(box);
  });
  body.scrollTop=0;
  setDock('ask');syncAsk();
}
function askAnswers(p){
  var out={},ok=true;
  p.questions.forEach(function(q,qi){
    var st=askSel[qi],parts=[];
    q.options.forEach(function(o,oi){if(st.picks.has(oi))parts.push(o.label)});
    if(st.otherOn&&st.other.trim())parts.push(st.other.trim());
    if(!parts.length)ok=false;else out[q.question]=parts.join(', ');
  });
  return ok?out:null;
}
function syncAsk(){var p=permQueue[0];$('#askGo').disabled=!(p&&p.questions&&askAnswers(p))}
$('#askGo').addEventListener('click',function(){
  var p=permQueue[0];if(!p||!p.questions)return;
  var ans=askAnswers(p);if(!ans)return;
  wsSend({t:'permission.reply',requestId:p.requestId,decision:'answer',answers:ans});
  showAnswers(p.toolUseID,ans);
  dropPerm(p.requestId,'allow');
});
$('#askNo').addEventListener('click',function(){
  var p=permQueue[0];if(!p)return;
  wsSend({t:'permission.reply',requestId:p.requestId,decision:'deny'});
  dropPerm(p.requestId,'deny');
});
function showAnswers(toolUseID,ans){
  var c=cards[toolUseID];if(!c||c.answered)return;c.answered=true;
  var d=document.createElement('div');d.className='answers';
  Object.keys(ans).forEach(function(k){var r=document.createElement('div');r.innerHTML='<b></b>：<span></span>';r.querySelector('b').textContent=k;r.querySelector('span').textContent=ans[k];d.appendChild(r)});
  c.add(d);c.open();
}

function onPermRequest(p){
  var c=cards[p.toolUseID];
  if(!c){c=newCard({id:p.toolUseID,name:p.name,target:p.target})}
  if(p.plan){var pl=document.createElement('div');pl.className='plan';pl.textContent=p.plan;c.add(pl)}
  c.status('wait','等待确认');c.open();
  permQueue.push(p);
  if(permQueue.length===1)showPerm();
}
function dropPerm(requestId,label){
  var i=permQueue.findIndex(function(p){return p.requestId===requestId});
  if(i<0)return;
  var p=permQueue.splice(i,1)[0];
  var c=cards[p.toolUseID];
  if(c){
    if(label==='deny'){c.status('no','已拒绝');c.collapse()}
    else if(label==='cancel'){c.status('no','已取消');c.collapse()}
    else c.status('run','运行中');
  }
  showPerm();
}
function reply(decision){
  var p=permQueue[0];if(!p)return;
  wsSend({t:'permission.reply',requestId:p.requestId,decision:decision});
  dropPerm(p.requestId,decision==='deny'?'deny':'allow');
  if(decision==='allow_session')addSys(p.alwaysLabel?'这一轮同类操作不再询问':'本会话内同类操作不再询问');
}
$('#bAllow').addEventListener('click',function(){reply('allow')});
$('#bDeny').addEventListener('click',function(){reply('deny')});
$('#bAlways').addEventListener('click',function(){reply('allow_session')});

// ---------- 服务端事件 ----------

function onEvent(m){
  if(/^(user|ai\.|tool\.|peer|perm\.|turn\.done|sys|cmd\.out)/.test(m.t||''))feedDirty=true;
  if(m.t!=='unread')lastEvt=Date.now();
  if(m.sessionId&&session&&m.sessionId!==session.id)return;
  if(narration)narration.onEvent(m);   // 过程播报：只读事件，不改现有逻辑
  switch(m.t){
  case 'session.opened':
    var sameSess=!!(session&&session.id===m.id),wasStick=stick;
    if(feedOwner&&feedOwner!==m.id)saveFeed(feedOwner);   // 电脑端直接切会话：把当前会话画好的内容留着（只存确实属于它的）
    session={id:m.id,title:m.title,cwd:m.cwd,cwdShort:m.cwdShort||'',branch:m.branch||''};lastSess={id:m.id,cwd:m.cwd};clearOpening();if(pendingOpen===m.id)pendingOpen=null;
    switchDraft(m.id);
    var hsig=histSig(m.history,m.historyTotal),fc=feedCache[m.id],reuse=!!(fc&&fc.sig&&fc.sig===hsig&&(!fc.inDom||feedOwner===m.id));
    delete feedCache[m.id];
    // 重连后服务器会重发同一个会话：已经画好的不动（正在看的位置不跳），断线前后实时画的去掉、按服务器记录补上
    var mergeFrom=sameSess?resumeTail(m):-1;
    if(mergeFrom>=0){permQueue=[];aiEl=null;histMore=histStart>0;renderHistory(m.history.slice(mergeFrom),(m.historyStart||0)+mergeFrom);reuse=true}
    else if(reuse){if(!fc.inDom){feed.innerHTML='';feed.appendChild(fc.frag)}cards=fc.cards;permQueue=[];aiEl=null;histStart=(m.historyTotal||0)-fc.kept;histMore=histStart>0}   // 记录没变：直接用上次画好的，不重画、不闪
    else{feed.innerHTML='';cards={};permQueue=[];aiEl=null}
    feedOwner=m.id;feedSig=hsig;feedDirty=false;histArmed=false;lastTop=0;histLoading=false;   // 刚打开不算「滑到顶」，要先离开顶部
    session.dir=(m.cwdShort||'').split('/').pop()||'';
    $('#sessBtn .dot').innerHTML=clawIcon(/^ds:/.test(m.id)?'deepseek':/^op:/.test(m.id)?'opencode':/^oc:/.test(m.id)?'openclaw':'claude');
    setHeader();
    $('#sessBtn .dot').classList.remove('off');
    sessionModes=m.modes||['default','acceptEdits','plan'];
    $('#cfgBtn').style.display=/^(oc|ds):/.test(m.id)?'none':'';   // OpenClaw / DeepSeek 没有权限模式
    cfg={models:null,model:null,effort:null,pick:'default'};cfgBusy=null;applyModel(m);
    setMode(m.mode,false);
    if(!reuse){
    if(m.mode!=='default')addSys('权限模式继承自原会话：'+(MODES.find(function(x){return x.key===m.mode})||{label:m.mode}).label);
    renderHistory(m.history,m.historyStart||0);
    histStart=m.historyStart||0;histMore=!!m.historyMore;setTimeout(fillShort,300);
    addSys((m.isNew?'已新建会话 ':'已恢复会话 ')+shortId(m.id)+'　'+(m.cwdShort||'')+(m.branch?' · 分支 '+m.branch:''));
    }
    localStorage.setItem(hk('session'),m.id);
    refreshList();goChat();bgRefreshList();
    suggestion=m.suggestion||null;
    commands=m.commands||[];syncCmdMenu();   // 输入框里已经有「/」时，弹层立刻换成这个会话的命令
    setBusy(m.busy);
    if(m.busy&&m.busyFor)workSince=Date.now()-m.busyFor;   // 用服务器记的开始时间（只传经过的毫秒数，不受手机时钟偏差影响）
    (m.pending||[]).forEach(onPermRequest);
    var merged=mergeFrom>=0;
    if(outbox){
      var lastUser=m.history.filter(function(it){return it.kind==='user'}).pop();
      if(outbox.sid!==m.id)outboxRestore();                       // 换了会话：不往别的会话发，放回输入框
      else if(lastUser&&lastUser.text===outbox.text)outboxDone();  // 其实已经送到了
      else if(m.busy)outboxRestore();                              // 会话正忙：放回输入框，等它忙完再发
      else{busy=true;setDock('busy');addSys('刚才那条消息没送到，已自动重发');outboxShow();trySend()}
    }
    if(merged){stick=wasStick;scrollDown()}else scrollDown(true);
    break;
  case 'session.busy':
    openFailed();clearOpening();
    if(m.canTakeover){
      if(confirmTakeover(m.name||shortId(m.id),m))wsSend({t:'session.open',id:m.id,mode:mode,takeover:true});
    }else{
      notice('这个会话'+idleText(m)+'（'+(m.name||'')+'）。原处闲置满 '+m.needMin+' 分钟后网页端才能接管；或者先在那边关掉它。');
    }
    break;
  case 'session.reclaimed':
    addSys('这个会话已在'+where(m.entrypoint)+'重新打开，网页端已退出（以原处的操作为准）。');
    localStorage.removeItem(hk('session'));
    break;
  case 'session.closed':
    if(m.reason==='deleted')addSys('当前会话已被删除');
    else if(m.reason!=='reclaimed')addSys('会话进程已关闭');
    $('#sessBtn .dot').classList.add('off');
    session=null;permQueue=[];suggestion=null;commands=[];cmdMenu.hidden=true;setBusy(false);
    break;
  case 'user':
    if(session&&m.text)liveLastPrompt(session.id,m.text);
    if(outbox&&m.text===outbox.text&&outbox.el&&outbox.el.isConnected){outbox.el.classList.remove('pending');if(m.queued)outbox.el.classList.add('queued');stamp(outbox.el,Date.now());outboxDone();think(true);break}
    if(outbox&&m.text===outbox.text)outboxDone();
    var ue=addUser(m.text,m.images);if(m.queued&&ue)ue.classList.add('queued');stamp(ue,Date.now());think(true);
    break;
  case 'queue.sent':   // 排队的消息发出去了（合成一条）
    feed.querySelectorAll('.msg.user.queued').forEach(function(e){e.classList.remove('queued')});
    break;
  case 'peer.pair':   // 有人申请协同配对：页面顶部提醒，点了直接去协同页
    pairBanner(m);
    break;
  case 'ai.start':
    aiEl=document.createElement('div');aiEl.className='msg ai md';aiText='';feed.appendChild(aiEl);ttsPos=0;ttsWarmUp();
    if(busy)think(true,'输出中');
    break;
  case 'ai.delta':
    if(!aiEl){aiEl=document.createElement('div');aiEl.className='msg ai md';aiText='';feed.appendChild(aiEl);ttsPos=0}
    aiText+=m.text;ttsStream(aiText,false);
    // 边输出边排版：最多每 80ms 渲染一次
    if(!aiRender)aiRender=setTimeout(function(){aiRender=null;if(aiEl){aiEl.innerHTML=md(aiText);scrollDown()}},80);
    break;
  case 'ai.end':
    clearTimeout(aiRender);aiRender=null;
    if(aiEl){aiEl.innerHTML=md(aiText);stamp(aiEl,Date.now());aiEl=null;scrollDown();ttsStream(aiText,true)}
    if(busy)think(true,'思考中');
    break;
  case 'tool.start':
    if(!cards[m.id]){var c=newCard(m);c.status('run','运行中')}
    if(busy)think(true,'运行 '+m.name);
    break;
  case 'tool.result':
    var c2=cards[m.id];
    if(c2)finishCard(c2,m.output,m.isError);
    if(busy)think(true,'思考中');
    break;
  case 'perm.request':
    think(false);onPermRequest(m);
    break;
  case 'perm.cancel':
    dropPerm(m.requestId,'cancel');
    break;
  case 'perm.done':
    if(m.answers)showAnswers(m.toolUseID,m.answers);
    dropPerm(m.requestId,m.decision==='deny'?'deny':'allow');
    if(busy&&!permQueue.length)think(true);
    break;
  case 'busy':
    setBusy(!!m.on);
    break;
  case 'session.meta':   // 会话信息变了（OpenClaw 换了模型）：更新标题栏
    if(session&&m.cwdShort){session.cwdShort=m.cwdShort;session.dir=m.cwdShort.split('/').pop()||'';setHeader()}
    break;
  case 'status':   // 一条会被替换的状态（例如 OpenClaw 模型重试），只显示在工作状态条上，不进消息流
    think(true,m.text);break;
  case 'turn.done':
    ttsHush=false;
    refreshList();
    if(m.error)addSys('本轮结束：'+m.error);
    document.querySelectorAll('.tool[data-k="run"],.tool[data-k="wait"]').forEach(function(n){
      n.dataset.k='no';n.querySelector('.ts').textContent='已取消';n.classList.remove('open');
    });
    permQueue=[];
    setBusy(false);
    break;
  case 'mode':
    if(m.modes)sessionModes=m.modes;   // 换了进程（比如切到跳过确认）：能切的模式也变了
    setMode(m.mode,true);
    break;
  case 'models': case 'model':
    applyModel(m);
    if(m.changed)cfgNote();
    break;
  case 'session.renamed':
    if(session){session.title=m.title;setHeader()}
    break;
  case 'suggest':
    setSuggestion(m.text);
    break;
  case 'commands':
    commands=m.commands||[];syncCmdMenu();
    break;
  case 'ai.full':
    addAi(m.text);stamp(feed.lastElementChild,Date.now());if(ttsModeAllows(3))ttsSay(m.text);
    break;
  case 'cmd.out':
    var po=document.createElement('pre');po.className='cmdout';po.textContent=m.text;feed.appendChild(po);scrollDown();
    break;
  case 'activity':
    activity=m.activity||{};renderActivity();
    break;
  case 'history.page':
    prependHistory(m);
    break;
  case 'unread':
    unread=m.unread||{};renderUnread();
    break;
  case 'peer':
    stamp(addPeer(m.from,m.text),Date.now());
    break;
  case 'sys':
    addSys(m.text);
    break;
  case 'error':
    openFailed();clearOpening();
    if(cfgBusy){cfgBusy=null;renderCfg()}
    if(outbox){outboxRestore();if(!m.busy)setBusy(false)}   // 会话还在忙（只是这条没收下）：别把它显示成空闲
    notice('⚠ '+m.message);
    break;
  }
}

// ---------- 连接 ----------

// 顶部：会话名（加粗）在左，后面是会话 ID 和目录名；没起名字时用目录名当名字
function setHeader(){
  if(!session)return;
  var t=(session.title||'').trim(),dir=session.dir||'';
  $('#nm').textContent=t||dir||'会话';
  var sid=$('#sid');sid.textContent='';
  var full=/^[0-9a-f]{8}-/i.test(session.id);   // Claude 的 UUID：放完整 ID、只露出前 8 位；其它的直接放短 ID
  var idEl=document.createElement('span');idEl.className='hid';idEl.title=session.id;idEl.textContent=full?session.id:shortId(session.id);
  sid.appendChild(idEl);
  // 第二行：目录（~/ 开头的完整路径）· 分支；名字本身就是目录名时只放分支。放不下从左边截，鼠标停留看完整的
  var name=t||dir||'会话',place=session.cwdShort||dir,parts=[];
  if(place&&place!==name)parts.push(place);
  if(session.branch)parts.push(session.branch);
  var w=$('#where');w.textContent='';
  if(parts.length){var b=document.createElement('bdi');b.textContent=parts.join(' · ');w.appendChild(b)}
  w.title=(session.cwd||place||'')+(session.branch?'\n分支：'+session.branch:'');
}
function wsSend(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=function(){
    retry=0;banner(null);
    if(connectedOnce)checkVersion();connectedOnce=true;
    wsSend({t:'visible',on:!document.hidden});
    if(wantPeer){wantPeer=false;history.replaceState(null,'','/');if(!DESKTOP.matches){goList();openPeerView();return}openPeerView()}
    var fromUrl=new URLSearchParams(location.search).get('s');
    if(fromUrl||location.search)history.replaceState(null,'','/');
    if(pendingOpen)fromUrl=pendingOpen;
    var last=fromUrl||(session?session.id:localStorage.getItem(hk('session')));
    if(!DESKTOP.matches&&!fromUrl){
      var view='';try{view=sessionStorage.getItem('claclaw.view')||''}catch(_){}
      if(startOnClaw){startOnClaw=false;goList(true);return}   // 主屏幕 App / 嵌在外壳里：先到 Claw 页
      if(mList||view!=='chat'||!last){goList();return}   // 手机：打开 App 先到会话列表（像微信）
    }
    if(last)wsSend({t:'session.open',id:last,mode:mode});
    if(!last||DESKTOP.matches)openSheet();   // 电脑端会话列表常驻：连上就加载，不管上次的会话能不能打开
  };
  ws.onmessage=function(e){try{onEvent(JSON.parse(e.data))}catch(err){console.error(err)}};
  ws.onclose=function(){
    // 断线：顶部小圆点变灰、不再闪，和「正在工作」区分开
    var dot=$('#sessBtn .dot');dot.classList.add('off');dot.classList.remove('busy');
    // 连不上可能是登录过期：先问一下，401 就回登录页
    fetch('/api/sessions',{method:'HEAD'}).then(function(r){
      if(r.status===401){location.replace('/login');return}
      banner('连接已断开，正在重连…');
      setTimeout(connect,Math.min(10000,500*Math.pow(2,retry++)));
    }).catch(function(){
      banner('连接已断开，正在重连…');
      setTimeout(connect,Math.min(10000,500*Math.pow(2,retry++)));
    });
  };
}

function run(text){
  text=(text||'').trim();
  if((!text&&!attachments.length)||!session)return;   // 正在工作时也能发：作为插话排队
  if(attachments.some(function(a){return !a.data}))return; // 还在压缩
  cmdMenu.hidden=true;
  var images=attachments.map(function(a){return {media_type:a.media_type,data:a.data}});
  attachments.forEach(function(a){URL.revokeObjectURL(a.url)});attachments=[];renderAtts();
  ta.value='';ta.style.height='auto';

// 会话池摘要：加入了几个会话、分布在几个目录
function poolTitle(id){var s=poolInfo(id);return s?(s.title||'(无标题)'):shortId(id)}
var CLAW_NAMES={claude:'Claude Code',openclaw:'OpenClaw',deepseek:'DeepSeek',opencode:'OpenCode'};
function peNormCfg(c){if(c&&c.dir&&c.dir.indexOf('|')<0)c.dir='claude|'+c.dir;return c}   // 旧配置只存了目录（没有「Claw|」前缀）：初次载入、每次操作后服务端回的配置都要转
function peDirKey(s){return (s.claw||'claude')+'|'+(s.claw==='openclaw'?'':(s.cwd||''))}   // OpenClaw 没有目录，全部归一组
function peDirLabel(k){var i=k.indexOf('|'),cl=k.slice(0,i),d=k.slice(i+1).replace(/^\/(Users|home)\/[^\/]+/,'~');return cl==='claude'?(d||'(未知目录)'):CLAW_NAMES[cl]+(d?' · '+d:'')}
function poolCwd(id){var s=poolInfo(id);return s?peDirKey(s):clawOf(id)+'|'}
function poolDir(id){var s=(peerList||[]).find(function(x){return x.id===id});return s?String(s.cwd||'').split('/').pop():''}
function poolSumText(){
  var ids=(peerCfg&&peerCfg.sessions)||[];if(!ids.length)return '还没加入会话';
  var dirs={};ids.forEach(function(id){dirs[poolDir(id)]=1});
  return '已加入 '+ids.length+' 个会话（'+Object.keys(dirs).length+' 个目录）：'+ids.map(function(id){return poolTitle(id)+'（'+poolDir(id)+'）'}).join('、')+'。改完点「保存」。';
}
function paintPoolSum(){var el=$('#pePoolSum');if(el)el.textContent=poolSumText()}
// ---------- 协同页：主页 + 子页面 ----------
// 主页：状态、配对申请、已配对（一行一个，点进详情）、三个入口（添加对方 / 协同会话 / 本机与网络）、复制邀请
// 子页面：p:<对方 id> 对方详情 | add 添加对方 | pool 协同会话 | net 本机与网络
var peerSub='';
function peerGo(sub){peerSub=sub||'';peerMsg={};renderPeer();var sp=$('.sheet-p');if(sp)sp.scrollTop=0}
function fmtMs(ms){return ms<1000?ms+' 毫秒':(ms/1000).toFixed(1)+' 秒'}
function peerDot(p){var o=peerOnline[p.id];return p.canCall?'<i class="h-dot'+(!o?' wait':o.online?' on':'')+'" title="'+(!o?'检查中':o.online?'在线':'离线')+'"></i>':''}
function peerRouteTag(p){var o=peerOnline[p.id];return o&&o.online&&o.route?'<em class="pe-route'+(o.route==='relay'?' rl':'')+'">'+(o.route==='relay'?'中继':'局域网')+'</em>':''}
var RELAY_ST={online:'已连上',connecting:'连接中…',offline:'断开了，正在重连',error:'连不上',off:'没开'};
function relayStateText(c){   // 主中继的状态（有备用的话带上个数）
  if(!c.relayInvite)return c.relay?'已设置地址':'没设置';
  var l=c.relayList||[],st=l[0]||c.relayState||{},on=l.filter(function(x){return x.status==='online'}).length;
  return (RELAY_ST[st.status]||'没连')+(l.length>1?'，'+on+'/'+l.length+' 个在线':'');
}
function peerLink(act,sub,k,v){return '<div class="h-row h-link" data-act="'+act+'" data-sub="'+sub+'"><span class="k">'+k+'</span><span class="v">'+(v||'')+'</span><span class="chev" aria-hidden="true"></span></div>'}
// 已配对列表（主页）
function peerPeersHtml(c){
  if(!c.peers||!c.peers.length)return hSec('已配对','<div class="h-row"><span class="v pe-left">还没有配对。'+(c.local?'点「添加对方」，或者把「复制邀请」发给对方。':'')+'</span></div>');
  return '<div><div class="h-h">已配对</div><div class="h-card">'+c.peers.map(function(p){
    var o=peerOnline[p.id];
    var v=!p.canCall?'只能对方找我们':!o?'检查中…':o.online?(o.sessions||[]).length+' 个会话':'离线';
    return '<div class="h-row h-link pe-peer ptint '+peerPc(p)+'" data-act="peer-sub" data-sub="p:'+esc(p.id)+'"><span class="k pe-peer-name">'+peerDot(p)+'<span>'+esc(p.name)+'</span>'+peerRouteTag(p)+'</span><span class="v">'+v+'</span><span class="chev" aria-hidden="true"></span></div>';
  }).join('')+'</div></div>';
}
// 对方详情里会随在线检查变的部分（每 10 秒刷新，不动下面的勾选框）
function peerDetailLive(c,p){
  var o=peerOnline[p.id],rs=o&&o.relay;
  var st=!p.canCall?'单向：只能对方找我们':!o?'检查中…':o.online?'在线'+(o.route?' · 走'+(o.route==='relay'?'中继':'局域网'):''):'离线'+(o.error?'：'+esc(o.error):'');
  var one=function(x){return x.ok?'可用（约 '+fmtMs(x.ms)+'）':'不通：'+esc(x.error||'')};
  var rl=!p.relay?'没有中继地址：离开局域网就联系不上':!o||!rs?'检查中…':!Array.isArray(rs)?one(rs):rs.length===1?one(rs[0]):rs.map(function(x,i){return (i?'备':'主')+' '+one(x)}).join('<br>');
  var ss=o&&o.online&&o.sessions||[];
  return hRow('状态',st)+hRow('中继',rl)+
    (o&&o.online?'<div class="h-row pe-col"><span class="k">对方开放的会话</span>'+(ss.length?'<ol class="pe-ss-list">'+ss.map(function(x){return '<li>'+esc(x.title||'(无标题)')+' <span class="pe-mono">'+esc(x.id)+'</span>'+(x.busy?' <em>工作中</em>':'')+'</li>'}).join('')+'</ol>':'<span class="v pe-left">没有</span>')+'</div>':'');
}
function peerDetailHtml(c,p){
  // 先按 Claw（图标 + 名字）、再按目录分组
  var pool=c.sessions||[],allow=p.allow,byClaw={};
  pool.forEach(function(id){var k=clawOf(id),d=poolCwd(id);var g=byClaw[k]=byClaw[k]||{dirs:{},order:[]};if(!g.dirs[d]){g.dirs[d]=[];g.order.push(d)}g.dirs[d].push(id)});
  var allowHtml=pool.length?'<div class="pe-allow" data-id="'+esc(p.id)+'">'+CLAW_ORDER.filter(function(k){return byClaw[k]}).map(function(k){
    var g=byClaw[k];
    return '<div class="pe-claw-g"><span class="pe-claw-ic">'+clawIcon(k)+'</span>'+esc(CLAW_NAMES[k])+'</div>'+g.order.map(function(d){
      return (k==='openclaw'?'':'<div class="pe-allow-dir">'+esc(peDirLabel(d).replace(/^[^·]*· /,''))+'</div>')+g.dirs[d].map(function(id){var on=!allow||allow.indexOf(id)>=0;
        return '<label><input type="checkbox" value="'+esc(id)+'"'+(on?' checked':'')+(c.canAssign?'':' disabled')+'><span>'+esc(poolTitle(id))+'</span></label>'}).join('');
    }).join('');
  }).join('')+'</div>':'<span class="v pe-left">协同会话池是空的，先到「协同会话」里加</span>';
  var h='<div class="claw-h pe-title ptint '+peerPc(p)+'"><span class="pe-peer-name">'+peerDot(p)+'<span>'+esc(p.name)+'</span>'+peerRouteTag(p)+'</span></div>';
  h+='<div><div class="h-card" id="peDetLive">'+peerDetailLive(c,p)+'</div></div>';
  h+='<div><div class="h-h">开放给它的会话</div><div class="h-card"><div class="h-row pe-col">'+allowHtml+'</div></div>'+
    '<div class="pe-note">'+(c.canAssign?'它只能看到、找到勾上的会话；勾选马上生效。':'它只能看到、找到勾上的会话。开放哪些会话只能在这台电脑上用 127.0.0.1 打开网页时改。')+'</div></div>';
  var prs=Array.isArray(p.relays)?p.relays:[];
  var relayRow=prs.length?prs.map(function(r,i){return '<span class="pe-mono">'+(prs.length>1?(i?'备 ':'主 '):'')+esc(r.replace(/#.*$/,'#…'))+'</span>'}).join('<br>'):(p.relays?p.relays+' 个':'没有');
  h+=hSec('连接',
    hRow('方向',p.canCall?'双向：两边都能主动找对方':'单向：只能对方找我们')+
    hRow('局域网地址','<span class="pe-mono">'+esc(p.inbox||'')+'</span>'+(p.inboxAlt?'<br><span class="pe-mono">'+esc(p.inboxAlt)+'</span>':''))+
    hRow('中继地址',relayRow+(c.local&&p.canCall?' <button type="button" class="pe-btn pe-mini" data-act="peer-relay-of" data-id="'+esc(p.id)+'">'+(p.relay?'改':'填')+'</button>':''))+
    hRow('配对','IP '+esc(p.ip||'')+' · '+fmtWhen(p.pairedAt)));
  if(c.local)h+='<div class="pe-btns pe-end"><button type="button" class="pe-btn del" data-act="peer-revoke" data-id="'+esc(p.id)+'" data-name="'+esc(p.name)+'">撤销配对</button></div>';
  return h;
}
// 添加对方：附近的 claclaw + 手动填地址申请
function peerAddHtml(c){
  var h=c.enabled?'':'<div class="pe-err">要先开启我们这边的协同（对方要能回连我们）</div>';
  h+='<div id="peNear">'+peerNearHtml(c)+'</div>';
  h+='<div><div class="h-h">填对方地址申请</div><div class="h-card">'+
    (c.outPair?
      '<div class="h-row"><span class="k">对方</span><span class="v pe-mono">'+esc(c.outPair.base.replace(/#.*$/,'#…'))+'</span></div>'+
      (c.outPair.pairing?(pePairT||pePairPoll(10),
      '<div class="h-row"><span class="k">状态</span><span class="v">配对中…</span></div>'+
      '<div class="pe-btns"><button type="button" class="pe-btn" data-act="peer-cancel">取消</button></div>'):
      '<div class="h-row"><span class="k">配对码</span><input id="peCode" class="pe-in mono" inputmode="numeric" maxlength="2" placeholder="对方告诉你的两位数"></div>'+
      '<div class="pe-btns"><button type="button" class="pe-btn pri" data-act="peer-finish">完成配对</button><button type="button" class="pe-btn" data-act="peer-cancel">取消</button></div>')
    :
      '<div class="h-row pe-urlrow"><span class="k">对方地址</span><textarea id="peUrl" class="pe-in pe-ta mono" rows="2" placeholder="对方给的协同地址（局域网的，或带 #pin= 的中继地址）"></textarea></div>'+
      '<div class="pe-btns"><button type="button" class="pe-btn pri" data-act="peer-start">申请配对</button></div>')+
    '</div><div class="pe-note">申请后对方页面上会出现一个两位数配对码，问对方要来填上就配好了，之后双方都能主动找对方。</div></div>';
  return h;
}
// 协同会话：上面「已加入」（按 Claw 分组，一眼看出开放了哪些 Claw 的会话，点「移出」马上生效）；
// 下面「添加会话」：先选 Claw，再搜 / 按目录勾选，勾上马上加入。不用再点保存
var peerPoolClaw='',peerPoolQ='';
var CLAW_ORDER=['claude','deepseek','opencode','openclaw'];
// Claw 的图标：和左边栏用同一份（左边栏的按钮里就是图标）
function clawIcon(k){var b=document.querySelector('#rail .rclaw[data-claw="'+k+'"]');return b?b.innerHTML:esc(CLAW_NAMES[k])}
function clawSegBtn(k,n,on){return '<button type="button" data-act="pool-claw" data-claw="'+k+'" title="'+esc(CLAW_NAMES[k])+'" aria-label="'+esc(CLAW_NAMES[k])+'"'+(on?' class="on"':'')+'>'+clawIcon(k)+(n?'<i>'+n+'</i>':'')+'</button>'}
function poolInfo(id){return (peerList||[]).find(function(x){return x.id===id})||((peerCfg&&peerCfg.poolInfo)||[]).find(function(x){return x.id===id&&x.title})}
function poolJoinedHtml(c){
  var ids=c.sessions||[];
  if(!ids.length)return '<div class="h-row"><span class="v pe-left">还没有。在下面勾选要加入协同的会话。</span></div>';
  var by={};ids.forEach(function(id){var k=clawOf(id);(by[k]=by[k]||[]).push(id)});
  return CLAW_ORDER.filter(function(k){return by[k]}).map(function(k){
    return '<div class="pe-claw-h"><b><span class="pe-claw-ic">'+clawIcon(k)+'</span>'+CLAW_NAMES[k]+'</b><span>'+by[k].length+' 个</span></div>'+by[k].map(function(id){
      var s=poolInfo(id),d=s?peDirLabel(peDirKey(s)).replace(/^[^·]*· /,''):'';
      return '<div class="h-row pe-pool-row"><span class="k"><span class="pe-pt">'+esc(s?(s.title||'(无标题)'):shortId(id))+'</span>'+(d&&k!=='openclaw'?'<small>'+esc(d)+'</small>':'')+'</span>'+
        (c.canAssign?'<button type="button" class="pe-btn del pe-mini" data-act="pool-del" data-id="'+esc(id)+'">移出</button>':'')+'</div>';
    }).join('');
  }).join('');
}
function poolListHtml(c){
  var q=peerPoolQ.trim().toLowerCase(),joined=c.sessions||[];
  var ss=(peerList||[]).filter(function(s){return (s.claw||'claude')===peerPoolClaw&&(!q||(String(s.title||'')+' '+String(s.cwd||'')+' '+s.id).toLowerCase().indexOf(q)>=0)});
  if(!ss.length)return '<div class="pe-note" style="margin:10px 14px">'+(q?'没有匹配的会话':'这个 Claw 没有会话')+'</div>';
  var by={},order=[];ss.forEach(function(s){var k=peDirKey(s);if(!by[k]){by[k]=[];order.push(k)}by[k].push(s)});
  return order.map(function(k){
    return (peerPoolClaw==='openclaw'?'':'<div class="pe-allow-dir pe-pool-dir">'+esc(peDirLabel(k).replace(/^[^·]*· /,''))+'</div>')+
      '<div class="pe-ss pool">'+by[k].map(function(s){return '<label><input type="checkbox" value="'+esc(s.id)+'"'+(joined.indexOf(s.id)>=0?' checked':'')+'><span>'+esc(s.title||'(无标题)')+'</span><small>'+esc(shortId(s.id))+'</small></label>'}).join('')+'</div>';
  }).join('');
}
function peerPoolHtml(c){
  var h='<div><div class="h-h">已加入（'+(c.sessions||[]).length+'）</div><div class="h-card" id="pePoolJoined">'+poolJoinedHtml(c)+'</div></div>';
  if(!c.canAssign)return h+'<div class="pe-note">开放哪些会话只能在这台电脑上用 127.0.0.1 打开网页时改，这里只能看。</div>';
  var have=CLAW_ORDER.filter(function(k){return (peerList||[]).some(function(s){return (s.claw||'claude')===k})});
  if(have.indexOf(peerPoolClaw)<0)peerPoolClaw=have[0]||'claude';
  var cnt=function(k){return (c.sessions||[]).filter(function(id){return clawOf(id)===k}).length};
  h+='<div><div class="h-h">添加会话</div><div class="h-card">'+
    '<div class="pe-seg">'+have.map(function(k){return clawSegBtn(k,cnt(k),k===peerPoolClaw)}).join('')+'</div>'+
    '<div class="h-row"><input id="pePoolQ" class="pe-in pe-q" placeholder="搜索会话名、目录" value="'+esc(peerPoolQ)+'"></div>'+
    '<div id="pePoolList">'+poolListHtml(c)+'</div>'+
    '</div><div class="pe-note">勾上马上加入、取消马上移出。加入的会话，再到每个对方的详情里设它能看到哪些。'+(c.enabled?'':'协同还没开启：加好会话后回上一页点「开启」。')+'</div></div>';
  return h;
}
// 改会话池：马上提交，只重画受影响的几块（不整页重画，搜索框里的字和滚动位置都不动）
function poolSave(arr){
  var prev=peerCfg.sessions;peerCfg.sessions=arr;poolPaint();
  fetch('/api/peer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessions:arr})}).then(function(r){return r.json()}).then(function(j){
    if(j.error){peerCfg.sessions=prev;peerMsg={err:j.error};paintPeerMsg();poolPaint();return}
    var keep={dir:peerCfg.dir,poolInfo:peerCfg.poolInfo};peerCfg=j;peerCfg.dir=keep.dir;peerCfg.poolInfo=keep.poolInfo;peerMsg={};paintPeerMsg();poolPaint();
  }).catch(function(e){peerCfg.sessions=prev;peerMsg={err:e.message};paintPeerMsg();poolPaint()});
}
function poolPaint(){
  var j=$('#pePoolJoined');if(j){j.innerHTML=poolJoinedHtml(peerCfg);var hh=j.parentNode.querySelector('.h-h');if(hh)hh.textContent='已加入（'+(peerCfg.sessions||[]).length+'）'}
  var l=$('#pePoolList');if(l)l.innerHTML=poolListHtml(peerCfg);
  document.querySelectorAll('.pe-seg button').forEach(function(b){var k=b.dataset.claw,n=(peerCfg.sessions||[]).filter(function(id){return clawOf(id)===k}).length;b.outerHTML=clawSegBtn(k,n,k===peerPoolClaw)});
}
// 本机与网络：名字、端口、我们的地址、中继
function peerNetHtml(c){
  var locked=c.peers&&c.peers.length;
  var h='<div><div class="h-h">本机</div><div class="h-card">'+
    (!c.local||locked?hRow('名字',esc(c.name||''))+hRow('端口','<span class="pe-mono">'+c.port+'</span>'):
      '<div class="h-row"><span class="k">名字</span><input id="peName" class="pe-in" maxlength="40" value="'+esc(c.name||'')+'"></div>'+
      '<div class="h-row"><span class="k">端口</span><input id="pePort" class="pe-in mono" type="number" min="1024" max="65535" value="'+c.port+'"></div>'+
      '<div class="pe-btns"><button type="button" class="pe-btn pri" data-act="peer-save">保存</button></div>')+
    '</div>'+(c.local?'<div class="pe-note">'+(locked?'已经有配对，名字和端口不能再改（改了对方就找不到这台电脑了）；确实要改，先撤销全部配对。':'名字会显示在对方那边。')+'</div>':'')+'</div>';
  if(c.base)h+='<div><div class="h-h">我们的协同地址</div><div class="h-card">'+
    (c.relay?hRow('中继',c.local?'<span class="pe-mono">'+esc(c.relay.replace(/#.*$/,'#…'))+'</span> <button type="button" class="pe-btn pe-mini" data-act="peer-copy" data-copy="'+esc(c.relay)+'">复制</button>':'已设置'):'')+
    (c.baseName?hRow('局域网','<span class="pe-mono">'+esc(c.baseName)+'</span>'):'')+
    hRow(c.baseName?'局域网 IP':'局域网','<span class="pe-mono">'+esc(c.base)+'</span>')+
    '</div><div class="pe-note">地址里不含密码：别人拿到只能申请配对，要你把两位数配对码告诉他才能配上。同一个局域网里优先直连，连不上自动走中继。</div></div>';
  if(c.local)h+='<div><div class="h-h">中继（跨网络）</div><div class="h-card">'+
    (c.relayList||[]).map(function(r){
      return '<div class="h-row pe-relay"><span class="k"><span class="pe-rl1"><em class="pe-route'+(r.primary?' rl':'')+'">'+(r.primary?'主':'备')+'</em><span class="pe-mono">'+esc(r.host||'')+'</span></span>'+
        '<small>'+(RELAY_ST[r.status]||r.status)+(r.error?'：'+esc(r.error):'')+'</small></span>'+
        (r.primary?'':'<button type="button" class="pe-btn pe-mini" data-act="relay-primary" data-i="'+r.i+'">设为主</button>')+
        '<button type="button" class="pe-btn del pe-mini" data-act="relay-remove" data-i="'+r.i+'" data-host="'+esc(r.host||'')+'">删除</button></div>';
    }).join('')+
    '<div class="h-row pe-urlrow"><span class="k">'+(c.relayInvite?'加一个':'邀请码')+'</span><textarea id="peRelayInv" class="pe-in pe-ta mono" rows="2" placeholder="粘贴中继邀请码 clarelay1.…'+(c.relayInvite?'（加进来先当备用）':'')+'"></textarea></div>'+
    '<div class="pe-btns"><button type="button" class="pe-btn pri" data-act="peer-relay-save">'+(c.relayInvite?'添加中继':'保存邀请码')+'</button></div>'+
    '</div><div class="pe-note">不在同一个局域网时经中继互发，可以同时连几个（主 → 备）：联系对方时先局域网、再主中继、再备用中继。中继地址每次联系对方时自动告诉它（用 claclaw 的对方会自动更新），换中继、加备用都不用重新配对。</div></div>';
  return h;
}
function peerMainHtml(c){
  var on=c.enabled?(c.listening?'已开启':'已开启，但没在监听'):'未开启';
  var h='<div><div class="h-card">'+
    '<div class="h-row"><span class="k">协同</span><span class="v">'+on+'</span>'+(c.local?(c.enabled?'<button type="button" class="pe-btn del pe-mini" data-act="peer-off">关闭</button>':'<button type="button" class="pe-btn pri pe-mini" data-act="peer-on">开启</button>'):'')+'</div>'+
    hRow('名字',esc(c.name||''))+
    hRow('网络','局域网'+(c.relay||c.relayInvite?' + 中继（'+relayStateText(c)+'）':''))+
    '</div></div>';
  h+='<div id="pePending">'+peerPendingHtml(c)+'</div><div id="pePeers">'+peerPeersHtml(c)+'</div>';
  h+='<div><div class="h-card">'+
    (c.local?peerLink('peer-sub','add','添加对方',''):'')+
    peerLink('peer-sub','pool','协同会话',(c.sessions||[]).length+' 个')+

// 只读服务端事件；文案只含动作词和文件名，不念路径、命令原文、displayName。
var narration=(function(){
  var P0=0,P1=1,P2=2;
  var BUCKET_MS=3000,MIN_GAP_MS=8000,DEDUP_MS=20000,MAX_QUEUE=6;
  var TTL={0:120000,1:60000,2:45000};
  var q=[],timer=null,bucket=[],bucketTimer=null,p0={},said={},lastP2=0,hiddenLatest=null;
  var muted=false,state='idle',startTimer=null;
  function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
  function base(target){
    var s=clean(target).replace(/\\/g,'/');
    if(!s)return '';
    if(/[\s"'`<>|&;]/.test(s))return '';   // 命令片段 / 带引号的目标：宁可不念
    s=s.split('/').pop();
    return s.length>48?s.slice(0,48)+'…':s;
  }
  // 四种 Claw 的工具名大小写/叫法都不同，统一收成动作；未知一律静默
  function kindOf(name){
    var n=String(name||'').trim();
    if(!n||n.length>40||/\s/.test(n))return '';   // DeepSeek 的 name 有时是整条命令
    n=n.toLowerCase().replace(/^mcp__[a-z0-9_]+__/,'');
    if(!n)return '';
    // 静默项要先判断：TodoWrite 里有 write，TaskCreate 里有 task
    if(/(^|[^a-z])(todo|todowrite|task(create|update|list|get|stop)|plan|think|grep|glob|list|ls)([^a-z]|$)/.test(n))return 'silent';
    if(/(^|[^a-z])(read|notebookread)([^a-z]|$)/.test(n))return 'read';
    if(/(^|[^a-z])(bash|sh|shell|exec|execute|command|terminal|run)([^a-z]|$)/.test(n))return 'bash';
    if(/multiedit|notebookedit|apply_?patch|edit|write|patch|replace|insert/.test(n))return 'edit';
    if(/web_?fetch|web_?search|webfetch|websearch|fetch|browse/.test(n))return 'web';
    if(/agent|subagent|sessions?_spawn|task/.test(n))return 'agent';
    return '';
  }
  function verbOf(k){
    return k==='edit'?'改文件':k==='bash'?'跑命令':k==='web'?'查网页':k==='read'?'读文件':k==='agent'?'派子任务':'';
  }
  function allowed(pri){return ttsModeAllows(pri)}
  function mark(items){
    var now=Date.now();
    items.forEach(function(it){said[it.kind+'|'+base(it.target)]=now});
    for(var k in said)if(now-said[k]>60000)delete said[k];

  function fresh(items){
    var now=Date.now(),out=[],seen={};
    items.forEach(function(it){

  }
  function phrase(kind,items){

    if(kind==='edit'){
      var n=targets.length||items.length;
      if(n===1&&targets.length)return '改了 '+targets[0];
      return '改了 '+n+' 个文件'+(targets.length?'：'+targets.slice(0,3).join('、')+(targets.length>3?' 等':''):'');
    }
    if(kind==='bash'){
      var cmds=items.map(function(it){return String(it.target||'').toLowerCase()});
      var all=function(re){return cmds.length&&cmds.every(function(c){return re.test(c)})};
      if(all(/(^|\s)(test|vitest|jest|pytest|npm\s+test|pnpm\s+test|yarn\s+test)(\s|$)/))return '跑测试';
      if(all(/git\s+commit/))return '提交代码';
      if(all(/(^|\s)(npm|pnpm|yarn|bun)\s+(install|i|add)(\s|$)/))return '装依赖';
      return items.length===1?'跑了一条命令':'跑了 '+items.length+' 条命令';
    }
    if(kind==='web')return items.length===1?'查资料':'查了 '+items.length+' 次资料';
    if(kind==='agent')return items.length===1?'派了个子任务':'派了 '+items.length+' 个子任务';

  function flushBucket(live){
    clearTimeout(bucketTimer);bucketTimer=null;

  }

  }
  function clearAllP0(){Object.keys(p0).forEach(clearP0)}

    var item={priority:P0,text:text,at:Date.now(),ttl:TTL[P0],requestId:m.requestId};
    clearP0(m.requestId);
    var rec={timer:null};
    rec.timer=setTimeout(function(){
      if(!p0[m.requestId])return;
      rec.timer=null;
      interrupt({priority:P0,text:text,at:Date.now(),ttl:TTL[P0],requestId:m.requestId});
    },15000);
    p0[m.requestId]=rec;
    interrupt(item);
  }
  function addTool(m){
    cancelStart();state='working';
    if(muted||!allowed(P2))return;
    var k=kindOf(m.name);
    if(!k||k==='read'||k==='silent')return;
    bucket.push({kind:k,target:m.target||'',at:Date.now()});
    if(!bucketTimer)bucketTimer=setTimeout(function(){flushBucket(true)},BUCKET_MS);
  }
  function finish(m){
    cancelStart();clearAllP0();flushBucket(false);

    muted=false;state='done';
    var err=clean(m.error).slice(0,40);

    enqueue({priority:P1,text:text,at:Date.now(),ttl:TTL[P1]});

  }
  function reset(){
    cancelStart();clearAllP0();

    if(timer){clearTimeout(timer);timer=null}

  }
  function onHidden(){
    var last=null;q.forEach(function(i){if(i.priority<=P1)last=i});

  }

  }
  return {
    onEvent:function(m){

    },

    onVisible:onVisible
  };
})();

      var a=document.createElement('a');a.href=j.httpsUrl;a.textContent=j.httpsUrl.replace(/^https:\/\//,'');a.style.color='var(--accent)';
      pushTip.appendChild(a);
      pushTip.appendChild(document.createTextNode('（打开后重新登录，再添加到主屏幕）'));
    }).catch(function(){});
    return;
  }
  if(Notification.permission==='denied'){pushBtn.hidden=true;pushTip.hidden=false;pushTip.textContent='通知被拒绝了：到 iPhone 设置 → 通知 → Claclaw 里打开';return}
  pushUI(false);$('#pushLocal').hidden=true;
  navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription()}).then(function(sub){
    if(!sub)return;
    return fetch('/api/push/status?endpoint='+encodeURIComponent(sub.endpoint)).then(function(r){return r.json()}).then(function(j){
      if(j.subscribed){pushUI(true);$('#pushLocal').hidden=false}
    });
  }).catch(function(){});
}
// 电脑提示音：推送时由运行 claclaw 的那台 Mac 直接响一声（浏览器的网页通知常常没声音）
var soundBtn=$('#soundBtn');
var SOUND_CN={Basso:'低沉',Blow:'吹气',Bottle:'瓶子',Frog:'蛙鸣',Funk:'放克',Glass:'玻璃',Hero:'英雄',Morse:'摩斯',Ping:'乒',Pop:'啵',Purr:'呼噜',Sosumi:'Sosumi',Submarine:'潜水艇',Tink:'叮'};
function showSound(j){
  soundBtn.hidden=!j.supported;
  var sel=$('#soundSel');
  $('#soundPick').hidden=!(j.supported&&j.on);
  if(j.sounds&&sel.options.length!==j.sounds.length){
    sel.innerHTML='';
    j.sounds.forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=(SOUND_CN[n]||n)+(SOUND_CN[n]&&SOUND_CN[n]!==n?'（'+n+'）':'');sel.appendChild(o)});
  }
  if(j.name)sel.value=j.name;
  soundBtn.dataset.on=j.on?'1':'';
}
function syncSound(){fetch('/api/sound').then(function(r){return r.json()}).then(showSound).catch(function(){})}
soundBtn.addEventListener('click',function(){
  fetch('/api/sound',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({on:!soundBtn.dataset.on})})
    .then(function(r){return r.json()}).then(function(j){showSound(j);toast(j.on?'已开启，刚才应该响了一声':'已关闭电脑提示音')});
});
$('#soundSel').addEventListener('change',function(e){
  fetch('/api/sound',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:e.target.value})})
    .then(function(r){return r.json()}).then(function(j){showSound(j);toast('已换成「'+(SOUND_CN[j.name]||j.name)+'」')});
});

    var sel=$(x[0]),v=String(x[1]);

// 排查用：直接在本机弹一条通知，不经苹果/微软的推送服务。
// 这条能弹、推送的不弹 → 问题在推送送达；这条也不弹 → 问题在系统或浏览器的通知设置
$('#pushLocal').addEventListener('click',function(){
  navigator.serviceWorker.ready.then(function(r){
    return r.showNotification('Claclaw 本机测试',{body:'能看到这条，说明系统通知设置没问题 '+new Date().toTimeString().slice(0,8),tag:'local-test',icon:'/icons/icon-192.png'});
  }).then(function(){toast('已弹出本机测试通知')},function(e){alert('弹通知失败：'+e.message)});
});
pushBtn.addEventListener('click',function(){
  if(pushBtn.dataset.on){
    navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription()}).then(function(sub){
      if(!sub)return;
      return fetch('/api/push/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}).then(function(){return sub.unsubscribe()});
    }).then(syncPushBtn);
    return;
  }
  // 每一步都显示在按钮上、并且有超时：卡住时能看出卡在哪一步，不会一直「正在开启…」
  function step(label,p,sec){
    $('#pushSub').textContent=label;
    return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error(label.replace(/…$/,'')+'超时（'+sec+' 秒没反应）'))},sec*1000)})]);
  }
  // iOS 要求：请求通知权限必须直接由这次点击触发
  step('等你允许通知…（看看有没有弹出询问框）',Notification.requestPermission(),60).then(function(perm){
    if(perm!=='granted'){syncPushBtn();if(perm==='denied')alert('通知被拒绝了：到浏览器或系统设置里允许这个网站发通知');return}
    return step('正在准备…',Promise.all([navigator.serviceWorker.ready,fetch('/api/push/key').then(function(r){return r.json()})]),15).then(function(x){
      return step('正在向推送服务登记…',x[0].pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(x[1].publicKey)}),20);
    }).then(function(sub){
      return fetch('/api/push/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON()})})
    }).then(function(r){
      if(!r.ok)throw new Error('保存订阅失败');
      return fetch('/api/push/test',{method:'POST'});
    }).then(function(){addSys('通知已开启，发了一条测试通知');syncPushBtn()});
  }).catch(function(e){alert('开启通知失败：'+e.message);syncPushBtn()});
});

// ---------- 新建同目录会话 ----------

var newDlg=$('#newDlg'),newFrom=null,newPick={model:null,effort:null};
function pickChips(box,items,cur,onPick){
  box.innerHTML='';
  items.forEach(function(it){
    var b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('role','radio');b.textContent=it.label;
    b.setAttribute('aria-checked',it.value===cur?'true':'false');
    b.addEventListener('click',function(){onPick(it.value);pickChips(box,items,it.value,onPick)});
    box.appendChild(b);
  });
}
function newSibling(s){
  if(/^oc:/.test(s.id||''))s={id:s.id,cwd:'',claw:'openclaw'};
  newFrom=s;
  var oc=s.claw==='openclaw';
  $('#newForm .newIn').hidden=oc;$('#newForm h3').textContent=oc?'新建 OpenClaw 会话':'新建会话';
  var d=$('#newDir');d.value=(s.cwd||'').replace(/^\/(Users|home)\/[^\/]+(?=\/|$)/,'~');
  d.style.width=Math.max(8,d.value.length+1)+'ch';
  $('#newName').value='';$('#newErr').textContent='';
  // Claude 会话：可以选模型 / 推理强度；默认「沿用」= 用参照会话的
  var isClaude=!/^(ds|op|oc):/.test(s.id||'')&&(!s.claw||s.claw==='claude');
  var ms=isClaude?(cfg.models&&cfg.models.length?cfg.models:lastModels):null;
  newPick={model:null,effort:null};$('#newPick').hidden=!ms;
  if(ms){
    var same=session&&session.id===s.id;
    var keepM=same?'沿用（'+curModelLabel()+'）':'沿用原会话',keepE=same&&cfg.effort?'沿用（'+effortLabel(cfg.effort)+'）':'沿用原会话';
    pickChips($('#newModels'),[{value:null,label:keepM}].concat(ms.map(function(m){return {value:m.value,label:m.value==='default'?'默认':modelShort(m.resolved||m.value)}})),null,function(v){newPick.model=v});
    pickChips($('#newEfforts'),[{value:null,label:keepE}].concat(EFFORTS.map(function(e){return {value:e.key,label:e.label}})),null,function(v){newPick.effort=v});
  }
  newDlg.classList.add('on');newDlg.setAttribute('aria-hidden','false');
  $('#newName').focus();
}
function closeNew(){newDlg.classList.remove('on');newDlg.setAttribute('aria-hidden','true');newFrom=null}
$('#newDir').addEventListener('input',function(e){e.target.style.width=Math.max(8,e.target.value.length+1)+'ch'});
$('#newNo').addEventListener('click',closeNew);
newDlg.addEventListener('click',function(e){if(e.target===newDlg)closeNew()});
$('#newForm').addEventListener('submit',function(e){
  e.preventDefault();if(!newFrom)return;
  var dir=$('#newDir').value.trim(),orig=(newFrom.cwd||'').replace(/^\/(Users|home)\/[^\/]+(?=\/|$)/,'~');
  var msg={t:'session.new',from:newFrom.id,title:$('#newName').value};
  if(newFrom.claw)msg.claw=newFrom.claw;
  if(dir&&dir!==orig)msg.cwd=dir;   // 改了目录才带上；服务器会检查目录是否存在
  if(newPick.model)msg.model=newPick.model;
  if(newPick.effort)msg.effort=newPick.effort;
  closeNew();closeSheet();
  wsSend(msg);
});

function renameSess(s){
  if(/^ds:/.test(s.id)&&session&&session.id===s.id){alert('DeepSeek 会话改名要先切到别的会话，再在列表里改（改名会先关掉网页里的这个会话）。');return}
  var t=prompt('给会话改个名字',s.title);
  if(t===null)return;
  t=t.replace(/\s+/g,' ').trim();
  if(!t||t===s.title)return;
  fetch('/api/sessions/rename',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:s.id,title:t})})
    .then(function(r){if(r.status===401){location.replace('/login');throw new Error('需要登录')}return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(x){if(!x.ok){alert(x.j.error||'改名失败');return}openSheet()})
    .catch(function(e){alert('改名失败：'+e.message)});
}

if(window.visualViewport){
  var app=$('#app');
  var wasKb=false;
  var fit=function(){
    var vh=window.visualViewport.height,kb=window.innerHeight-vh>120;
    document.documentElement.style.setProperty('--vvh',vh+'px');
    document.body.classList.toggle('kb',kb);
    if(wasKb&&!kb)setTimeout(rebuildScrollers,80);   // 键盘刚收起
    wasKb=kb;
    app.style.height=Math.max(200,vh)+'px';
    window.scrollTo(0,0);follow();scrollDown();
  };
  // 键盘弹出时 iOS 会把可视区域往下挪（页面本身不动），顶栏就有一截钻到状态栏下面、被新版 iOS 加上模糊；
  // 让整个界面跟着可视区域走，顶栏始终贴在状态栏下面
  var follow=function(){
    var off=Math.max(0,Math.round(window.visualViewport.offsetTop||0));
    app.style.transform=off?'translateY('+off+'px)':'';
  };
  fit();
  // 键盘收起（输入框失焦）时主动复位，别等 iOS
  document.addEventListener('focusout',function(){setTimeout(function(){window.scrollTo(0,0);follow()},60);setTimeout(function(){window.scrollTo(0,0);follow();rebuildScrollers()},350)});
  // 键盘弹出时 iOS 把聊天区推到状态栏底下、给它加了顶部模糊，收起后不撤；返回列表（聊天区被隐藏）才会消失。
  // 所以键盘收起时让 iOS 重建这个滚动区域：先关掉滚动再打开，滚动位置原样恢复
  function rebuildScrollers(){
    [feed,$('#sList')].forEach(function(el){
      if(!el||!el.offsetParent)return;
      var st=el.scrollTop;el.style.overflowY='hidden';void el.offsetHeight;
      requestAnimationFrame(function(){el.style.overflowY='';el.scrollTop=st});
    });
  }
  window.visualViewport.addEventListener('resize',fit);
  window.visualViewport.addEventListener('scroll',function(){window.scrollTo(0,0);follow()});
}
